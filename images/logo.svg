<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logobg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="logoaccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="200" height="200" rx="40" fill="url(#logobg)"/>
  <!-- Inner design -->
  <rect x="20" y="20" width="160" height="160" rx="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- WC letters -->
  <text x="100" y="105" font-family="Arial,sans-serif" font-size="62" font-weight="900" fill="#ffffff" text-anchor="middle">WC</text>
  <!-- Accent underline -->
  <rect x="45" y="118" width="110" height="5" rx="3" fill="url(#logoaccent)"/>
  <!-- Bottom text -->
  <text x="100" y="155" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="middle" letter-spacing="2">WEBCRAFTSTUDIO</text>
  <!-- Small dot decorations -->
  <circle cx="30" cy="30" r="3" fill="rgba(255,255,255,0.2)"/>
  <circle cx="170" cy="30" r="3" fill="rgba(255,255,255,0.2)"/>
  <circle cx="30" cy="170" r="3" fill="rgba(255,255,255,0.2)"/>
  <circle cx="170" cy="170" r="3" fill="rgba(255,255,255,0.2)"/>
</svg>
